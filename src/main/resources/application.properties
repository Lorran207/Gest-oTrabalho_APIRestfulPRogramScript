# Carrega o .env (formato CHAVE=valor). Procura primeiro na pasta atual e, se a
# IDE tiver aberto a pasta acima do projeto, também em ./gestao-vagas/.env.
# "optional:" evita erro se o arquivo não existir (ex.: produção, onde as
# variáveis vêm do próprio ambiente). Variáveis reais do sistema têm prioridade.
spring.config.import=optional:file:.env[.properties],optional:file:./gestao-vagas/.env[.properties]

# Banco de Dados: Supabase (PostgreSQL)
# Sem valores padrão de propósito (nada de credencial embutida no código).
# Se o .env não for encontrado, a URL fica como "${SUPABASE_DB_URL}" literal
# e a conexão falha com "Driver ... claims to not accept jdbcUrl".
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: o plano gratuito do Supabase limita as conexões simultâneas
spring.datasource.hikari.maximum-pool-size=5

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Paginação
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
